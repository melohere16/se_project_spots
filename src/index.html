<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <title>Spots</title>
  </head>

  <body>
    <div class="page">
      <header class="header">
        <img src="./images/Logo.svg" alt="Spots Logo" class="header__logo" />
      </header>

      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <img
              src="./images/avatar.jpg"
              alt="Profile Avatar"
              class="profile__avatar"
            />
            <button type="button" class="profile__avatar-edit-btn">
              <img
                src="./images/whitepen.svg"
                class="profile__avatar-edit-icon"
              />
              Edit Avatar
            </button>
          </div>

          <div class="profile__column">
            <h1 class="profile__name">melo</h1>
            <p class="profile__description">Software Engineer at Tripleten</p>
            <button type="button" class="profile__edit-btn">
              <img src="./images/Group-2.svg" class="profile__edit-icon" />
              Edit Profile
            </button>
          </div>

          <button type="button" class="profile__add-btn">
            <img src="./images/Group-26.svg" class="profile__add-icon" />
            New Post
          </button>
        </section>

        <section class="cards">
          <ul class="cards__list"></ul>

          <template id="card-template">
            <li class="card">
              <button class="card__delete-button" type="button"></button>
              <img src="#" alt="" class="card__image" />
              <div class="card__content">
                <h2 class="card__title"></h2>
                <button type="button" class="card__like-button"></button>
              </div>
            </li>
          </template>
        </section>
      </main>

      <footer class="footer">
        <p class="footer__text">2025 © Spots</p>
      </footer>

      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn"></button>

          <h3 class="modal__title">Edit Profile</h3>

          <form class="modal__form" novalidate>
            <label class="modal__label">
              Name
              <input
                id="profile-name-input"
                type="text"
                class="modal__input"
                minlength="2"
                maxlength="40"
                required
              />
              <span id="profile-name-input-error" class="modal__error"></span>
            </label>

            <label class="modal__label">
              Description
              <input
                id="profile-description-input"
                type="text"
                class="modal__input"
                minlength="2"
                maxlength="200"
                required
              />
              <span
                id="profile-description-input-error"
                class="modal__error"
              ></span>
            </label>

            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn"></button>

          <h3 class="modal__title">New Post</h3>

          <form class="modal__form" novalidate>
            <label class="modal__label">
              Image link
              <input
                id="card-image-input"
                type="url"
                class="modal__input"
                placeholder="Place a link to a picture"
                required
              />
              <span id="card-image-input-error" class="modal__error"></span>
            </label>

            <label class="modal__label">
              Caption
              <input
                id="image-caption-input"
                type="text"
                class="modal__input"
                minlength="2"
                maxlength="30"
                required
              />
              <span id="image-caption-input-error" class="modal__error"></span>
            </label>

            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <div class="modal" id="edit-avatar-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn"></button>

          <h3 class="modal__title">Change Profile Picture</h3>

          <form class="modal__form" novalidate>
            <label class="modal__label">
              Avatar link
              <input
                id="avatar-link-input"
                type="url"
                class="modal__input"
                placeholder="Paste your image URL"
                required
              />
              <span id="avatar-link-input-error" class="modal__error"></span>
            </label>

            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>

      <div class="modal" id="delete-confirm-modal">
        <div class="modal__container modal__container_delete">
          <div class="modal__header_delete">
            <h3 class="modal__title_delete">
              Are you sure you want to delete this image?
            </h3>

            <button
              type="button"
              class="modal__close-btn_delete"
              aria-label="Close"
            ></button>
          </div>

          <form class="modal__form modal__form_type_delete" novalidate>
            <button type="submit" class="modal__submit-btn_delete">
              Delete
            </button>

            <button type="button" class="modal__cancel-btn">Cancel</button>
          </form>
        </div>
      </div>

      <div class="modal modal_type_preview" id="preview-modal">
        <div class="modal__image-container">
          <button
            type="button"
            class="modal__close-btn modal__close-btn_type_preview"
          ></button>

          <img src="#" alt="" class="modal__image" />
          <p class="modal__caption"></p>
        </div>
      </div>
    </div>
  </body>
</html>
